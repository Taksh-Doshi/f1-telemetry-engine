name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -e .
      - run: ruff check src tests
      - run: pytest

  integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: f1_telemetry_test
          POSTGRES_USER: f1_test
          POSTGRES_PASSWORD: f1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U f1_test -d f1_telemetry_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://f1_test:f1_test@localhost:5432/f1_telemetry_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -e .
      - run: python -c "from f1engine.db import run_schema; run_schema()"
      - run: pytest -m integration
